name: keepalive (防自动停用)
on:
  schedule:
    # GitHub 会暂停 60 天无活动的仓库的定时任务，每月 1 号提交一个空 commit 保活
    - cron: "0 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keepalive $(date -u +%F)"
          git push
